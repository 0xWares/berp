services:
  redis:
    image: redis:7-alpine
    container_name: berp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - berp-redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - berp

  # ---------------------------------------------------------------
  # Optional: uncomment if you ever want Postgres in Docker instead
  # of the native install. Remember to stop the system Postgres first.
  # ---------------------------------------------------------------
