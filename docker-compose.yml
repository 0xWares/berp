  #     POSTGRES_USER: berp
  #     POSTGRES_PASSWORD: berp
  #     POSTGRES_DB: berp_dev
  #   ports:
  #     - "127.0.0.1:5433:5432"   # use 5433 to avoid conflict with native PG
  #   volumes:
  #     - berp-postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U berp -d berp_dev"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - berp

volumes:
  berp-redis-data:
  # berp-postgres-data:

networks:
  berp:
    driver: bridge